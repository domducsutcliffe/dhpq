name: Refresh PQ data

on:
  workflow_dispatch:
  # Validate refresh fixes immediately; generated data commits do not match.
  push:
    branches: [main]
    paths:
      - scripts/refresh-data.mjs
      - scripts/refresh-plan.mjs
      - scripts/refresh-data.test.mjs
      - scripts/encrypt-data.mjs
      - config.js
      - .github/workflows/refresh-data.yml
  schedule:
    # Primary 06:00 UK refresh, plus off-hour catch-ups if GitHub misses it.
    - cron: "0 6 * * *"
      timezone: "Europe/London"
    - cron: "17 6,7 * * *"
      timezone: "Europe/London"

permissions:
  contents: write

# Serialise scheduled, manual and code-change refreshes to avoid competing pushes.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    name: New questions and their answers (priority)
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      # Fail before fetching if the saved dataset cannot be decrypted.
      - name: Check the encryption password is configured
        env:
          PQ_PASSWORD: ${{ secrets.PQ_PASSWORD }}
        run: |
          if [ -z "$PQ_PASSWORD" ]; then
            echo "::error::The PQ_PASSWORD repository secret is not set, so the refreshed data could not be encrypted or committed. Add it under Settings → Secrets and variables → Actions; it must match the password the committed .enc files were encrypted with."
            exit 1
          fi
          echo "PQ_PASSWORD is set."
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check whether today's scheduled refresh is already complete
        id: freshness
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const ukDate = value => new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London' }).format(new Date(value));
          let alreadyFresh = false;
          try {
            const status = JSON.parse(readFileSync('data/refresh-status.json', 'utf8'));
            const hour = Number(new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', hour: '2-digit', hourCycle: 'h23' }).format(new Date(status.refreshedAt)));
            alreadyFresh = ukDate(status.refreshedAt) === ukDate(Date.now()) && hour >= 6;
          } catch {}
          const run = process.env.TRIGGER_EVENT !== 'schedule' || !alreadyFresh;
          appendFileSync(process.env.GITHUB_OUTPUT, 'run=' + run + '\n');
          console.log(run ? 'Refresh required.' : 'Already refreshed today; skipping scheduled catch-up.');
          NODE
      - uses: actions/setup-node@v4
        if: steps.freshness.outputs.run == 'true'
        with:
          node-version: "24"
      - name: Test refresh modes and house coverage
        if: steps.freshness.outputs.run == 'true'
        run: node --test scripts/refresh-data.test.mjs
      - name: Refresh new questions and their answers
        if: steps.freshness.outputs.run == 'true'
        env:
          # Lets the refresh decrypt the committed .enc to find its prior state.
          PQ_PASSWORD: ${{ secrets.PQ_PASSWORD }}
        # Re-fetch recent tabling dates only; older-answer work is a separate run.
        # Each mode keeps its own successful-refresh date for catching up missed days.
        run: node scripts/refresh-data.mjs --mode=recent
      - name: Encrypt data files
        if: steps.freshness.outputs.run == 'true'
        env:
          PQ_PASSWORD: ${{ secrets.PQ_PASSWORD }}
        run: node scripts/encrypt-data.mjs
      - name: Record successful refresh time
        if: steps.freshness.outputs.run == 'true'
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync('data/refresh-status.json', JSON.stringify({ refreshedAt: new Date().toISOString() }) + '\n');
          NODE
      - name: Commit data changes
        if: steps.freshness.outputs.run == 'true'
        run: |
          # Stage everything under data/commons (encrypted chunks, the questions-index.json
          # manifest, and any chunk files added/removed as the dataset grows or shrinks)
          # plus the shared geography file. -A picks up deletions; .gitignore keeps the
          # plaintext json out.
          git add -A data/commons data/constituency-regions.json data/refresh-status.json
          if git diff --cached --quiet; then
            echo "No PQ data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh new PQs and their answers"
          # A push straight after the commit fails if anything landed on main while the
          # refresh was running — a merge, or another fire of this workflow. Rebase onto
          # whatever arrived and retry; the data is derived, so nothing can conflict.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto origin/main and retrying."
            git pull --rebase origin main
          done
          echo "Could not push the refreshed data after 3 attempts."
          exit 1

