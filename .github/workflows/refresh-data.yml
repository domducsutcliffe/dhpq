name: Refresh PQ data

on:
  workflow_dispatch:
  # Validate refresh fixes immediately; generated data commits do not match.
  push:
    branches: [main]
    paths:
      - scripts/refresh-data.mjs
      - scripts/encrypt-data.mjs
      - config.js
      - .github/workflows/refresh-data.yml
  schedule:
    # 06:00 UK time every day, following GMT/BST automatically.
    # GitHub may queue scheduled runs later during periods of high load.
    - cron: "0 6 * * *"
      timezone: "Europe/London"

permissions:
  contents: write

# Serialise scheduled, manual and code-change refreshes to avoid competing pushes.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Without the password the refresh can't decrypt the previous dataset, so it falls
      # back to a full rebuild — ~23,900 questions off the Parliament API, up to 20
      # minutes — and only then dies at the encrypt step. Check first: five seconds, and
      # the log says what is actually wrong.
      - name: Check the encryption password is configured
        env:
          PQ_PASSWORD: ${{ secrets.PQ_PASSWORD }}
        run: |
          if [ -z "$PQ_PASSWORD" ]; then
            echo "::error::The PQ_PASSWORD repository secret is not set, so the refreshed data could not be encrypted or committed. Add it under Settings → Secrets and variables → Actions; it must match the password the committed .enc files were encrypted with."
            exit 1
          fi
          echo "PQ_PASSWORD is set."
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Refresh committed dashboard data
        env:
          # Lets the refresh decrypt the committed .enc to find its prior state.
          PQ_PASSWORD: ${{ secrets.PQ_PASSWORD }}
        # Merge new questions and newly answered questions into the saved dataset.
        # The script rechecks 60 days of tabled/answer dates in monthly batches, so
        # missed runs are caught up and old questions receiving new answers are updated.
        # Full answer text is fetched by the app on hover (config.enrichAnswers).
        run: node scripts/refresh-data.mjs
      - name: Encrypt data files
        env:
          PQ_PASSWORD: ${{ secrets.PQ_PASSWORD }}
        run: node scripts/encrypt-data.mjs
      - name: Commit data changes
        run: |
          # Stage everything under data/commons (encrypted chunks, the questions-index.json
          # manifest, and any chunk files added/removed as the dataset grows or shrinks)
          # plus the shared geography file. -A picks up deletions; .gitignore keeps the
          # plaintext json out.
          git add -A data/commons data/constituency-regions.json
          if git diff --cached --quiet; then
            echo "No PQ data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh PQ dashboard data"
          # A push straight after the commit fails if anything landed on main while the
          # refresh was running — a merge, or another fire of this workflow. Rebase onto
          # whatever arrived and retry; the data is derived, so nothing can conflict.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto origin/main and retrying."
            git pull --rebase origin main
          done
          echo "Could not push the refreshed data after 3 attempts."
          exit 1
